<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members - Artrobots</title>
    <link rel="stylesheet" href="style.css" />
    <script src="i18n.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archive:wght@400;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2E2640",
              secondary: "#855EDE",
              accent: "#FF5733",
              light: "#AED6F1",
              dark: "#000402",
              purple: "#4A17AB",
              gray: "#878A96",
              teal: "#508596",
            },
            fontFamily: {
              sans: ["Noto Sans", "sans-serif"],
              display: ["Archive", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .member-card {
        transition: all 0.3s ease;
      }
      .member-card .member-details {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .member-card:hover .member-details {
        max-height: 300px;
      }
    </style>
  </head>
  <body class="bg-dark text-white font-sans">
    <custom-navbar></custom-navbar>

    <!-- Hero Section -->
    <section
      class="relative min-h-[40vh] flex items-center justify-center bg-gradient-to-b from-primary to-dark"
      style="padding-top: 100px"
    >
      <div class="container mx-auto px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-bold mb-4 font-display">
          MEMBERS
        </h1>
        <p class="text-xl text-gray-300">Meet all Artrobots members</p>
      </div>
    </section>

    <!-- Members Grid -->
    <section class="py-20 bg-dark">
      <div class="container mx-auto px-6">
        <div class="grid md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6">
          <!-- Member Card Template - Copy/paste to add more members -->

          <!-- Example card -->
          <div
            class="member-card bg-gradient-to-br from-gray-900 to-gray-800 rounded-xl shadow-xl hover:shadow-2xl transition-all duration-300 border border-gray-700 overflow-hidden"
          >
            <div class="p-6 text-center">
              <!-- Area badge -->
              <div class="absolute top-4 right-4">
                <div
                  class="w-10 h-10 bg-gradient-to-br from-secondary to-blue-600 rounded-full flex items-center justify-center"
                >
                  <i data-feather="cpu" class="w-5 h-5"></i>
                </div>
              </div>

              <!-- Photo -->
              <div class="relative mx-auto mb-4 w-32 h-32">
                <img
                  src="assets/logo_circulo.png"
                  alt="Member"
                  class="w-full h-full rounded-full object-cover border-4 border-secondary"
                />
              </div>

              <!-- Nickname -->
              <h3 class="text-2xl font-bold mb-1">Nickname</h3>

              <!-- Full name -->
              <p class="text-gray-400 text-sm mb-4">Full Name Here</p>

              <!-- Details (expand on hover) -->
              <div class="member-details mt-4 pt-4 border-t border-gray-700">
                <div class="space-y-2 text-left">
                  <p class="text-sm">
                    <span class="text-gray-400">Year Joined:</span>
                    <span class="ml-2 font-medium">2024</span>
                  </p>
                  <p class="text-sm flex items-center">
                    <i
                      data-feather="cpu"
                      class="w-4 h-4 mr-2 text-secondary"
                    ></i>
                    <span class="text-gray-400">Computing</span>
                  </p>
                  <p class="text-sm italic text-gray-500">Area Captain</p>
                  <a
                    href="mailto:membro@example.com"
                    class="flex items-center justify-center mt-3 text-secondary hover:text-accent transition-colors"
                  >
                    <i data-feather="mail" class="w-5 h-5"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Add more cards here following the template above -->
        </div>
      </div>
    </section>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
